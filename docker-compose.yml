# ================================
# UrutiX Smart Logistics - Docker Compose
# ================================
# 
# This is the original docker-compose.yml file.
# For development, use: docker-compose -f docker-compose.dev.yml up
# For production, use: docker-compose -f docker-compose.production.yml up -d
#
# This file is kept for backward compatibility and simple database-only setup.
# ================================

version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: urutix_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: urutix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urutix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
