services:
  # ============================================================
  # PostgreSQL Database with PostGIS
  # ============================================================
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: urutix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-urutix}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - urutix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-urutix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Redis Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: urutix_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - urutix_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend — NestJS API (port 3005)
  # Accessible to host nginx at 127.0.0.1:3005
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: urutix_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-urutix}
      DB_SSL: ${DB_SSL:-false}
      DB_SYNCHRONIZE: "false"
      AUTO_MIGRATE: "true"
      FAIL_ON_MIGRATION_ERROR: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://urutix.com}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MOBILE_MONEY_API_URL: ${MOBILE_MONEY_API_URL}
      MOBILE_MONEY_API_KEY: ${MOBILE_MONEY_API_KEY}
      MOBILE_MONEY_CALLBACK_URL: ${MOBILE_MONEY_CALLBACK_URL}
      MOBILE_MONEY_CURRENCY: ${MOBILE_MONEY_CURRENCY:-RWF}
      MOBILE_MONEY_ACCOUNT_PHONE: ${MOBILE_MONEY_ACCOUNT_PHONE}
      FRONTEND_URL: ${FRONTEND_URL:-https://urutix.com}
    ports:
      - "3005:3005"   # Host nginx proxies this via gateway
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - urutix_network
      - sparkmonitoring_locwise_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Frontend — React SPA served by nginx (port 5173)
  # Accessible to host nginx at 127.0.0.1:5173
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://urutix.com/api}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-wss://urutix.com}
    container_name: urutix_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"   # Host nginx proxies this via gateway
    networks:
      - urutix_network
      - sparkmonitoring_locwise_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # NOTE: No Docker nginx container.
  # The host nginx (already running on ports 80/443 with SSL)
  # acts as the reverse proxy. See nginx/setup-host-nginx.sh
  # ============================================================

networks:
  urutix_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  # Shared network with sparkmonitoring-frontend-1 (the host nginx container)
  # This allows sparkmonitoring nginx to reach urutix containers by name
  sparkmonitoring_locwise_net:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
