<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Configuration Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        const { Plus, Save, X, Percent } = lucideReact;

        const PolicyConfigurationModal = ({ isOpen, onClose, onSave, category, loading = false }) => {
            const [formData, setFormData] = useState({});
            const [errors, setErrors] = useState({});

            if (!isOpen) return null;

            const getCategoryConfig = () => {
                switch (category) {
                    case 'interestRates':
                        return {
                            title: 'New Interest Rate Policy',
                            icon: React.createElement(Percent, { size: 20 }),
                            fields: [
                                { key: 'name', label: 'Policy Name', type: 'text', required: true },
                                { key: 'riskLevel', label: 'Risk Level', type: 'select', options: ['low', 'medium', 'high', 'critical'], required: true },
                                { key: 'baseRate', label: 'Base Rate (%)', type: 'number', step: '0.1', required: true },
                                { key: 'minRate', label: 'Minimum Rate (%)', type: 'number', step: '0.1', required: true },
                                { key: 'maxRate', label: 'Maximum Rate (%)', type: 'number', step: '0.1', required: true }
                            ]
                        };
                    default:
                        return {
                            title: 'New Configuration',
                            icon: React.createElement(Percent, { size: 20 }),
                            fields: []
                        };
                }
            };

            const config = getCategoryConfig();

            const handleInputChange = (key, value) => {
                setFormData(prev => ({ ...prev, [key]: value }));
                if (errors[key]) {
                    setErrors(prev => ({ ...prev, [key]: '' }));
                }
            };

            const validateForm = () => {
                const newErrors = {};
                config.fields.forEach(field => {
                    if (field.required && !formData[field.key]) {
                        newErrors[field.key] = `${field.label} is required`;
                    }
                });
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = () => {
                if (!validateForm()) return;
                const policyData = {
                    id: `${category.toUpperCase().slice(0, 2)}-${Date.now().toString().slice(-6)}`,
                    ...formData,
                    isActive: true,
                    created_at: new Date().toISOString()
                };
                onSave(policyData);
            };

            const renderField = (field) => {
                const value = formData[field.key] || '';
                const error = errors[field.key];

                switch (field.type) {
                    case 'select':
                        return React.createElement('select', {
                            value: value,
                            onChange: (e) => handleInputChange(field.key, e.target.value),
                            className: `w-full px-3 py-2 border rounded-lg text-sm ${error ? 'border-red-300' : 'border-slate-200'} focus:outline-none focus:ring-2 focus:ring-blue-500`
                        }, [
                            React.createElement('option', { key: '', value: '' }, `Select ${field.label}`),
                            ...field.options.map(option => 
                                React.createElement('option', { key: option, value: option }, 
                                    option.charAt(0).toUpperCase() + option.slice(1).replace('_', ' ')
                                )
                            )
                        ]);
                    default:
                        return React.createElement('input', {
                            type: field.type,
                            step: field.step,
                            value: value,
                            onChange: (e) => handleInputChange(field.key, field.type === 'number' ? parseFloat(e.target.value) || '' : e.target.value),
                            className: `w-full px-3 py-2 border rounded-lg text-sm ${error ? 'border-red-300' : 'border-slate-200'} focus:outline-none focus:ring-2 focus:ring-blue-500`,
                            placeholder: `Enter ${field.label.toLowerCase()}`
                        });
                }
            };

            return React.createElement('div', {
                className: "fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
            }, 
                React.createElement('div', {
                    className: "bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden"
                }, [
                    // Header
                    React.createElement('div', {
                        key: 'header',
                        className: "flex items-center justify-between p-6 border-b border-slate-100"
                    }, [
                        React.createElement('div', {
                            key: 'title',
                            className: "flex items-center gap-3"
                        }, [
                            React.createElement('div', {
                                key: 'icon',
                                className: "p-2 bg-blue-50 rounded-lg text-blue-600"
                            }, config.icon),
                            React.createElement('div', { key: 'text' }, [
                                React.createElement('h2', {
                                    key: 'h2',
                                    className: "text-lg font-bold text-slate-900"
                                }, config.title),
                                React.createElement('p', {
                                    key: 'p',
                                    className: "text-sm text-slate-500"
                                }, 'Configure new policy parameters')
                            ])
                        ]),
                        React.createElement('button', {
                            key: 'close',
                            onClick: onClose,
                            className: "p-2 hover:bg-slate-100 rounded-lg transition-colors"
                        }, React.createElement(X, { size: 20, className: "text-slate-400" }))
                    ]),
                    
                    // Form
                    React.createElement('div', {
                        key: 'form',
                        className: "p-6 overflow-y-auto max-h-[calc(90vh-140px)]"
                    }, 
                        React.createElement('div', {
                            className: "grid grid-cols-1 md:grid-cols-2 gap-4"
                        }, config.fields.map(field => 
                            React.createElement('div', { key: field.key }, [
                                React.createElement('label', {
                                    key: 'label',
                                    className: "block text-sm font-medium text-slate-700 mb-1"
                                }, [
                                    field.label,
                                    field.required && React.createElement('span', {
                                        key: 'required',
                                        className: "text-red-500 ml-1"
                                    }, '*')
                                ]),
                                renderField(field),
                                errors[field.key] && React.createElement('p', {
                                    key: 'error',
                                    className: "text-red-500 text-xs mt-1"
                                }, errors[field.key])
                            ])
                        ))
                    ),
                    
                    // Footer
                    React.createElement('div', {
                        key: 'footer',
                        className: "flex items-center justify-end gap-3 p-6 border-t border-slate-100"
                    }, [
                        React.createElement('button', {
                            key: 'cancel',
                            onClick: onClose,
                            className: "px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
                        }, 'Cancel'),
                        React.createElement('button', {
                            key: 'submit',
                            onClick: handleSubmit,
                            disabled: loading,
                            className: "px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50"
                        }, loading ? [
                            React.createElement('div', {
                                key: 'spinner',
                                className: "w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
                            }),
                            'Creating...'
                        ] : [
                            React.createElement(Save, { key: 'icon', size: 16 }),
                            'Create Policy'
                        ])
                    ])
                ])
            );
        };

        const TestApp = () => {
            const [showModal, setShowModal] = useState(false);
            const [policies, setPolicies] = useState([]);

            const handleSave = (policyData) => {
                console.log('New policy created:', policyData);
                setPolicies(prev => [...prev, policyData]);
                setShowModal(false);
                alert('Policy created successfully!');
            };

            return React.createElement('div', {
                className: "min-h-screen bg-gray-50 p-8"
            }, [
                React.createElement('div', {
                    key: 'header',
                    className: "max-w-4xl mx-auto"
                }, [
                    React.createElement('h1', {
                        key: 'title',
                        className: "text-3xl font-bold text-gray-900 mb-8"
                    }, 'Policy Configuration Test'),
                    
                    React.createElement('button', {
                        key: 'button',
                        onClick: () => setShowModal(true),
                        className: "flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors"
                    }, [
                        React.createElement(Plus, { key: 'icon', size: 20 }),
                        'New Interest Rate Policy'
                    ]),
                    
                    React.createElement('div', {
                        key: 'policies',
                        className: "mt-8"
                    }, [
                        React.createElement('h2', {
                            key: 'subtitle',
                            className: "text-xl font-semibold mb-4"
                        }, `Created Policies (${policies.length})`),
                        
                        policies.length === 0 ? 
                            React.createElement('p', {
                                key: 'empty',
                                className: "text-gray-500"
                            }, 'No policies created yet. Click the button above to create one.') :
                            React.createElement('div', {
                                key: 'list',
                                className: "space-y-4"
                            }, policies.map(policy => 
                                React.createElement('div', {
                                    key: policy.id,
                                    className: "bg-white p-4 rounded-lg border border-gray-200"
                                }, [
                                    React.createElement('h3', {
                                        key: 'name',
                                        className: "font-semibold"
                                    }, policy.name),
                                    React.createElement('p', {
                                        key: 'details',
                                        className: "text-sm text-gray-600 mt-1"
                                    }, `Risk Level: ${policy.riskLevel}, Base Rate: ${policy.baseRate}%`)
                                ])
                            ))
                    ])
                ]),
                
                React.createElement(PolicyConfigurationModal, {
                    key: 'modal',
                    isOpen: showModal,
                    onClose: () => setShowModal(false),
                    onSave: handleSave,
                    category: 'interestRates',
                    loading: false
                })
            ]);
        };

        ReactDOM.render(React.createElement(TestApp), document.getElementById('root'));
    </script>
</body>
</html>
