<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Truck Icon (Simplified) -->
  <g transform="translate(50, 50)">
    <!-- Truck Body -->
    <rect x="-25" y="-10" width="35" height="20" rx="3" fill="url(#grad2)"/>
    <!-- Truck Cabin -->
    <rect x="10" y="-12" width="15" height="22" rx="2" fill="#ffffff" opacity="0.95"/>
    <!-- Wheels -->
    <circle cx="-12" cy="12" r="5" fill="#14532d"/>
    <circle cx="8" cy="12" r="5" fill="#14532d"/>
    <!-- Cargo -->
    <rect x="-25" y="-15" width="30" height="5" rx="2" fill="#ffffff" opacity="0.8"/>
    <!-- Window -->
    <rect x="12" y="-10" width="10" height="8" rx="1" fill="#16a34a" opacity="0.3"/>
  </g>
  
  <!-- Letter U -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">U</text>
</svg>
