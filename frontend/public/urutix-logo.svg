<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Truck Icon -->
  <g transform="translate(60, 60)">
    <!-- Truck Body -->
    <rect x="-50" y="-20" width="70" height="40" rx="6" fill="url(#grad2)"/>
    <!-- Truck Cabin -->
    <rect x="20" y="-25" width="30" height="45" rx="4" fill="#ffffff" opacity="0.95"/>
    <!-- Wheels -->
    <circle cx="-25" cy="25" r="10" fill="#14532d"/>
    <circle cx="15" cy="25" r="10" fill="#14532d"/>
    <!-- Wheel Details -->
    <circle cx="-25" cy="25" r="6" fill="#ffffff" opacity="0.3"/>
    <circle cx="15" cy="25" r="6" fill="#ffffff" opacity="0.3"/>
    <!-- Cargo Box -->
    <rect x="-50" y="-30" width="60" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
    <!-- Window -->
    <rect x="25" y="-20" width="20" height="15" rx="2" fill="#16a34a" opacity="0.3"/>
  </g>
  
  <!-- UrutiX Text -->
  <text x="140" y="50" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#grad1)">UrutiX</text>
  <text x="140" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">Smart Logistic</text>
</svg>
