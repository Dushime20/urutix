version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: urutix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urutix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - urutix-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urutix-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=urutix
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
    volumes:
      - ./uploads:/app/uploads
      - ./dist:/app/dist
    depends_on:
      - postgres
    networks:
      - urutix-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: urutix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/app/uploads:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - urutix-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  urutix-network:
    driver: bridge

volumes:
  postgres_data: 